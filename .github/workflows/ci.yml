name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite is deliberately dependency-light: config, persona, memory and
      # the tools all run without the LiveKit stack installed, which keeps CI
      # fast and avoids pulling heavy audio wheels on every push.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      - name: Run tests
        run: pytest

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy httpx

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

  build:
    name: install and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Installs the real runtime dependencies, so a broken LiveKit API
      # assumption surfaces here rather than in production.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import the full runtime
        run: python -c "import nina.runtime, nina.providers, nina.agent, nina.compat; print('imports ok')"

      - name: CLI smoke test
        run: |
          nina version
          nina prompt > /dev/null
          nina doctor || true   # expected to report missing credentials in CI

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
